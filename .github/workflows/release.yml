name: Release

# Cross-compiles mcp-local with GoReleaser and publishes a GitHub release.
# - workflow_call: run by bump-version.yml right after it pushes the vX.Y.Z tag. (A tag pushed with
#   GITHUB_TOKEN does not trigger other workflows, so the bump workflow calls this one directly.)
# - workflow_dispatch: (re)release any existing tag by hand.
# - pull_request: a snapshot dry run when the release setup itself changes; nothing is published.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.1
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.1
        required: true
        type: string
  pull_request:
    paths:
      - .goreleaser.yaml
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SNAPSHOT: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean ${{ env.SNAPSHOT == 'true' && '--snapshot --skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.tag }}
