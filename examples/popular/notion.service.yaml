# Official Notion MCP server (remote Streamable HTTP with OAuth)
# One-liner:
#   mcp-local add notion --type http --mcp-url https://mcp.notion.com/mcp
#
# Alternative self-hosted stdio option is commented below.
- name: notion
  type: http
  mcp_url: https://mcp.notion.com/mcp
  description: Official Notion MCP (workspace search, Markdown page read and edit)

